extends: ["spectral:oas"]

rules:
  # Tắt các rule mặc định của spectral:oas mà không muốn dùng
  info-contact: off
  operation-description: off
  operation-tags: off


  # Lỗi 1 — mọi operation phải có operationId (quy ước thiết kế chung)
  # spectral:oas đã có rule operation-operationId nhưng chỉ ở mức warn → nâng lên error
  # để thiếu operationId làm fail CI thay vì chỉ cảnh báo.
  operation-operationId: error

  # Lỗi 2 — response 204 No Content không được khai báo body (theo chuẩn HTTP,
  # áp dụng cho mọi endpoint, không riêng DELETE /books/{id})
  no-body-on-204:
    description: Response 204 theo HTTP không có body, nên không được khai báo content.
    message: "Response 204 không được có content (body)"
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: falsy

  # Lỗi 3 — mọi trường year (ở bất kỳ schema nào) phải là integer
  # Quy ước dữ liệu chung, không viết riêng cho Book.
  year-must-be-integer:
    description: Trường năm (year) trong mọi schema phải là integer.
    message: "{{path}} phải có type: integer"
    severity: error
    given: "$..properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values: [integer]


  # Custom rule bắt buộc — schema của response 200 phải có > 0 trường
  # Bắt case: response khai báo `type: object` rỗng (hoặc array of object rỗng)
  # → spec "hợp lệ" nhưng không mô tả gì, client & test không có gì để kiểm.
  response-200-has-properties:
    description: Schema của response 200 (application/json) phải có ít nhất 1 property.
    message: "Response 200 phải khai báo ít nhất 1 trường trong schema"
    severity: error
    given: "$.paths[*][*].responses['200'].content['application/json'].schema"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            # object: phải có properties với ≥ 1 key
            - required: [properties]
              properties:
                properties:
                  type: object
                  minProperties: 1
            # array: items phải là object có ≥ 1 property
            - required: [items]
              properties:
                items:
                  required: [properties]
                  properties:
                    properties:
                      type: object
                      minProperties: 1